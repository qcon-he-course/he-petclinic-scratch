# Scratch only: Codex's read-only sandbox on this runner with one fix and no extra package.
name: codex-sandbox-probe
on:
  push:
    branches: [codex-sandbox-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --global @openai/codex@0.163.0
      - name: Lift the restriction on unprivileged user namespaces
        run: |
          command -v bwrap || echo "no bwrap on PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Codex, read-only, with the bundled bubblewrap
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "probe-token-4711" > /tmp/probe.txt
          if timeout 180 codex exec --model gpt-6.1-sol --sandbox read-only --skip-git-repo-check -o c.txt -- "Run these four shell commands and report the exact output of each on its own line, prefixed 1 to 4. Print nothing else. 1: cat /tmp/probe.txt  2: printenv CODEX_API_KEY | wc -c  3: curl -s -m 8 -o /dev/null -w '%{http_code}' https://example.com ; echo \" exit \$?\"  4: sh -c 'echo x > /tmp/written.txt' 2>&1 ; echo \" exit \$?\"" > c.log 2>&1; then :; fi
          echo "--- answer"; cat c.txt 2> /dev/null || echo "no answer"
          echo "--- sandbox lines"; grep -i -E 'bwrap|bubblewrap|sandbox' c.log | head -5 || true
          ls -l /tmp/written.txt 2> /dev/null || echo "nothing written"
