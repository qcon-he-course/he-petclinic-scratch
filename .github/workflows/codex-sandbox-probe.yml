# Scratch only: Codex's read-only sandbox on this runner with one fix and no extra package.
name: codex-sandbox-probe
on:
  push:
    branches: [codex-sandbox-probe]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --global @openai/codex@0.163.0
      - name: Lift the restriction on unprivileged user namespaces
        run: |
          command -v bwrap || echo "no bwrap on PATH"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Codex, read-only, with the bundled bubblewrap
        env:
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "probe-token-4711" > /tmp/probe.txt
          ask="Run these two shell commands and report the exact output of each on its own line, prefixed 1 and 2. Print nothing else. 1: cat /tmp/probe.txt  2: printenv CODEX_API_KEY | wc -c"
          try() {
            echo "--- $1"
            if timeout 180 codex exec --model gpt-6.1-sol --sandbox read-only --skip-git-repo-check -c "$1" -o c.txt -- "$ask" > c.log 2>&1; then :; fi
            cat c.txt 2> /dev/null || { echo "no answer"; tail -5 c.log; }
            echo
          }
          try 'shell_environment_policy.ignore_default_excludes=false'
          if grep -q '^2: 0' c.txt; then echo "the key is hidden from commands"; exit 0; fi
          try 'shell_environment_policy.inherit="core"'
          if grep -q '^2: 0' c.txt; then echo "the key is hidden from commands"; fi
