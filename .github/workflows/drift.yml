# On a schedule, with no pull request to start it: does every scenario in the main specs
# still have a test that runs and passes at its declared level?
#
#   check    runs the suite and the drift check. No model, no key, read-only.
#   report   only when drift is found. Files or updates one issue, from the finding lines
#            that have the shape the check writes. No model.
#
# A schedule runs from the default branch. In a public repository GitHub switches a
# schedule off after 60 days with no activity.
name: drift

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

env:
  HARNESS_REPOSITORY: qcon-he-course/he-harness
  HARNESS_COMMIT: 463dd92cee7ec3d78f1b21fad7e3b0a6ef0d97fa

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      drift: ${{ steps.drift.outputs.drift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: code
          persist-credentials: false
      - name: Check out the harness at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          ref: ${{ env.HARNESS_COMMIT }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: code/pom.xml
      - name: Run the drift check
        id: drift
        run: |
          if harness/ci/drift.sh code out > /dev/null; then echo "drift=no" >> "$GITHUB_OUTPUT"; else echo "drift=yes" >> "$GITHUB_OUTPUT"; fi
          if [ -f out/drift.md ]; then cat out/drift.md >> "$GITHUB_STEP_SUMMARY"; else echo "The drift check wrote no result." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: drift
          path: out/drift.md
          if-no-files-found: ignore
          overwrite: true
      - name: Fail the run when there is drift
        if: steps.drift.outputs.drift == 'yes'
        run: exit 1

  report:
    needs: check
    if: always() && needs.check.outputs.drift == 'yes'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Check out the harness at its pinned commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.HARNESS_REPOSITORY }}
          ref: ${{ env.HARNESS_COMMIT }}
          path: harness
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: drift
          path: out
        continue-on-error: true
      - name: File or update the one drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Drift: the specs and the tests disagree"
        run: |
          if ! python3 -B harness/ci/drift-issue.py out/drift.md > body.md; then
            printf 'The scheduled drift check failed and left no finding in the expected shape. See run %s.\n' "$GITHUB_RUN_ID" > body.md
          fi
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title $TITLE" --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file body.md
          fi
