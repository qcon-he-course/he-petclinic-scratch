# After a merge to the protected branch: build once, record what was built, and wait for
# a person before the image is released.
#
#   build     builds the jar and the image from the merged commit, pushes the image to the
#             registry under its commit, and attests it: a signed record of which workflow
#             built this exact image from which commit.
#   release   waits in the "production" environment for a named person's approval. Only
#             then does the image get the tag people pull.
#
# The merge job of the pull-request workflow starts this run. A merge made with the
# workflow's own token does not start workflows by itself, and a dispatch does.
name: release

on:
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build the jar
        run: ./mvnw -B -DskipTests package
      - name: Build and push the image, under its commit
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image:$GITHUB_SHA" .
          docker push "$image:$GITHUB_SHA"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$GITHUB_SHA" | cut -d@ -f2)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Built \`$image@$digest\` from commit \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Attest what built it
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - name: Check the record, then release the image a person approved
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gh attestation verify "oci://$image@$DIGEST" --repo "$GITHUB_REPOSITORY"
          docker buildx imagetools create --tag "$image:released" "$image@$DIGEST"
          {
            echo "Released \`$image:released\`, which is \`$DIGEST\`."
            echo
            echo "To run it: \`docker run --rm -p 8080:8080 $image:released\`"
            echo
            echo "To check what built it: \`gh attestation verify oci://$image:released --repo $GITHUB_REPOSITORY\`"
          } >> "$GITHUB_STEP_SUMMARY"
